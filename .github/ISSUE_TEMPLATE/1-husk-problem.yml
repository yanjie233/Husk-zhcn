name: Husk 本身的问题
description: Husk 闪退、卡死、无法安装、无法开启 JIT，或它自身的界面显示有问题。
title: "[Husk] "
labels: ["bug", "husk"]
body:
  - type: markdown
    attributes:
      value: |
        本表单用于反馈 **Husk 本身**的问题。如果是某个**游戏或应用**无法运行，请改用「游戏或应用无法运行」表单。

        缺少日志或下列细节的 issue 会被关闭。**日志是解决问题的关键。**
  - type: dropdown
    id: area
    attributes:
      label: 这是哪一类问题？
      options:
        - Husk 闪退或自行关闭
        - Husk 卡死或无响应
        - Husk 无法安装
        - JIT 无法开启
        - Android（模拟运行）无法启动或无法下载
        - Husk 自身界面显示异常
        - 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么？
      description: 你做了什么、一步步的操作、你的预期，以及实际发生了什么。
      placeholder: |
        1. 打开 Husk
        2. 点按 …
        3. Husk 退出
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        **必填。** 请附上 `husk.log` 和 `husk-native.log`（把文件拖进本框）。它们位于「文件」App ›「我的 iPhone」›「Husk」。
        如果 Husk 闪退了，请重新打开：它会提供可分享的崩溃报告。「设置」›「关于」› **「打开控制台」** 可查看实时日志。
        截图或屏幕录制也会有帮助。
      placeholder: 把 husk.log 和 husk-native.log 拖到这里。
    validations:
      required: true
  - type: input
    id: husk-version
    attributes:
      label: Husk 版本
      description: 「设置」页面顶部会显示，例如 "Version 1.0.1 · 6bee247"。请整行复制。
      placeholder: Version 1.0.1 · 6bee247
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备
      placeholder: iPhone 15 Pro
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS 版本
      placeholder: "18.6.2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 你当初是如何安装 Husk 的？
      options:
        - SideStore
        - AltStore
        - TrollStore
        - TrollStore Lite
        - 付费或企业证书（Esign、Scarlet、Feather 等）
        - Xcode
        - 其他
    validations:
      required: true
  - type: dropdown
    id: jit
    attributes:
      label: 你如何开启 JIT？
      options:
        - StikDebug
        - 内置 StikJIT
        - TrollStore
        - 越狱（Dopamine 或其他）
        - 我没有 JIT
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前请确认
      options:
        - label: 我使用的已是最新版本的 Husk。
          required: true
        - label: 我已搜索过现有 issue，此问题此前没有被报告过。
          required: true

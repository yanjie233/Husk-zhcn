name: 游戏或应用无法运行
description: Android 游戏或应用闪退、无法启动、显示异常、没有声音，或在 Husk 中操控无响应。
title: "[游戏] "
labels: ["bug", "compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        本表单用于反馈**在 Husk 中运行的游戏或应用**。如果是 Husk 本身的问题，请改用「Husk 本身的问题」表单。

        缺少日志或下列细节的 issue 会被关闭。**日志是解决游戏问题的关键。**
  - type: dropdown
    id: method
    attributes:
      label: 你是如何运行它的？
      description: |
        **转译层（原生）：** 添加到 Husk 的资料库并从它的页面启动，无需启动 Android。
        **Android（模拟运行）：** 安装在 Husk 启动的 Android 系统内部。
      options:
        - 转译层（原生）
        - Android（模拟运行）
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 游戏或应用
      description: 它的名称，以及（如果你知道）它的包名和版本。
      placeholder: Geometry Dash (com.robtopx.geometryjump) 2.207
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 这个 APK 来自哪里？
      description: Husk 的 Store 标签页、另一台设备上的 Google Play、APKMirror、开发者官网、F-Droid 等。
      placeholder: Husk 的 Store 标签页
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: 出了什么问题？
      options:
        - 无法启动，或卡在加载画面、黑屏
        - 闪退（Husk 关闭）
        - 在资料库中显示 "Did not start" 或 "Crashed"
        - 画面异常或缺失
        - 没有声音，或声音损坏
        - 触摸、键盘或手柄无效
        - 运行太慢
        - 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么？
      description: 你做了什么、进行到了哪一步、你看到了什么。截图或屏幕录制会很有帮助。
      placeholder: |
        已添加 APK，点按 Play，加载画面显示了 10 秒，随后 Husk 关闭。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        **必填。** 请附上问题刚发生时的 `husk.log` 和 `husk-native.log`（把文件拖进本框）。它们位于「文件」App ›「我的 iPhone」›「Husk」。
        如果 Husk 闪退了，请重新打开：它会提供可分享的崩溃报告。使用转译层时，游戏页面 › **技术详情** 中也有它的报告。
      placeholder: 把 husk.log 和 husk-native.log 拖到这里。
    validations:
      required: true
  - type: input
    id: husk-version
    attributes:
      label: Husk 版本
      description: 「设置」页面顶部会显示，例如 "Version 1.0.1 · 6bee247"。请整行复制。
      placeholder: Version 1.0.1 · 6bee247
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备
      placeholder: iPhone 15 Pro
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS 版本
      placeholder: "18.6.2"
    validations:
      required: true
  - type: dropdown
    id: jit
    attributes:
      label: 你如何开启 JIT？
      options:
        - StikDebug
        - 内置 StikJIT
        - TrollStore
        - 越狱（Dopamine 或其他）
        - 我没有 JIT
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前请确认
      options:
        - label: 我使用的已是最新版本的 Husk。
          required: true
        - label: 我已搜索过现有 issue，此游戏此前没有被报告过。
          required: true
